name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (CPU-only PyTorch, from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Unit tests and test-set consistency checks. They use stand-ins for the models,
      # index and LLMs, so CI needs no data downloads and no API keys.
      - name: Test
        run: uv run pytest -q

      - name: requirements.txt matches uv.lock
        run: |
          sh deploy/export_requirements.sh
          git diff --exit-code requirements.txt
