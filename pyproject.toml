[project]
name = "documind"
version = "0.1.0"
description = "Question answering over documents with cited answers and a measured evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "qdrant-client>=1.19.1",
    "numpy>=2.5.3",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = false
